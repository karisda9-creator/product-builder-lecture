<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>오늘 뭐 먹지?</h1>
            <button id="theme-toggle" class="btn-theme">테마 변경</button>
        </header>
        <main>
            <div id="result-area" class="result-area">
                <p id="food-display">메뉴를 추천받으세요!</p>
            </div>
            <div class="button-group">
                <button id="recommend-btn" class="btn-primary">메뉴 추천</button>
                <button id="reset-btn" class="btn-secondary">초기화</button>
            </div>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>
